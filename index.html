<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FDAReview — Discover Great Places & Share Honest Reviews</title>
  <meta name="description" content="Explore verified hotels and restaurants near you, post community reviews, and earn FDA Coins.">
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- App CSS -->
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
  <!-- Header / Nav -->
  <div id="main-header"></div>

  <main class="main-content">
    <!-- Hero Section -->
    <section class="hero-section">
      <div class="container">
        <div class="hero-tagline">
          <span>✨</span> Discover. Review. Earn.
        </div>
        <div style="margin-bottom: var(--space-4); font-size: var(--font-size-xs); color: var(--text-muted);">
          Created by <strong style="color:var(--accent-primary);">Aditya Thorat</strong> &bull; MIT CSN
        </div>
        <h1 class="hero-title">
          Find great places.<br>Share <span>honest reviews</span>.
        </h1>
        <p class="hero-subtitle">
          Explore local hotels, cafes, and dining spots on our interactive map. Post your experience and instantly earn 10 FDA Coins in your wallet.
        </p>

        <!-- Search Bar -->
        <div class="search-bar-wrapper">
          <span style="padding-left: 1rem; color: var(--text-muted); font-size: 1.25rem;">🔍</span>
          <input type="text" id="city-search-input" class="search-input" placeholder="Search city or area (e.g. Pune, Mumbai, FC Road)..." autocomplete="off">
          <button id="use-location-btn" class="btn btn-secondary btn-sm" title="Discover places around my current GPS location">
            <span>📍</span> Near Me
          </button>
          <button id="search-submit-btn" class="btn btn-primary btn-sm">
            Search
          </button>
        </div>
      </div>
    </section>

    <!-- Main Explore Map & List Section -->
    <section class="container" style="flex: 1; display: flex; flex-direction: column;">
      <div class="explore-container">
        <!-- Sidebar: Place List -->
        <aside class="places-sidebar">
          <div class="sidebar-header">
            <div>
              <h3 style="font-size: var(--font-size-base);">Discovered Places</h3>
              <div class="places-count" id="places-count-label">Loading nearby establishments...</div>
            </div>
            <div id="filter-wrapper" style="display:flex; gap: 4px;">
              <button class="btn btn-secondary btn-sm" id="filter-all-btn" style="padding: 2px 8px; font-size: 11px;">All</button>
              <button class="btn btn-secondary btn-sm" id="filter-hotels-btn" style="padding: 2px 8px; font-size: 11px;">Hotels</button>
              <button class="btn btn-secondary btn-sm" id="filter-food-btn" style="padding: 2px 8px; font-size: 11px;">Food</button>
            </div>
          </div>

          <div class="places-list" id="places-list-container">
            <!-- Skeleton cards while loading -->
            <div class="skeleton" style="height: 110px; margin-bottom: 8px;"></div>
            <div class="skeleton" style="height: 110px; margin-bottom: 8px;"></div>
            <div class="skeleton" style="height: 110px; margin-bottom: 8px;"></div>
          </div>
        </aside>

        <!-- Map wrapper -->
        <div class="map-wrapper">
          <div id="map"></div>
          <div class="map-control-overlay">
            <button id="refresh-map-btn" class="btn btn-secondary btn-sm" style="background: rgba(20,32,25,0.9);">
              🔄 Refresh Area
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <div id="main-footer"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Application Logic -->
  <script type="module">
    import { initAuth } from './assets/js/auth.js';
    import { renderNavigation, renderFooter } from './assets/js/navigation.js';
    import { initMap, setMapView, renderUserLocationMarker, displayEstablishmentMarkers, getDirectionsUrl } from './assets/js/map.js';
    import { fetchNearbyPlaces, geocodeCityOrArea } from './assets/js/places.js';
    import { showToast, escapeHTML, renderStarRating } from './assets/js/ui.js';
    import { CONFIG } from './assets/js/config.js';

    let currentPlaces = [];
    let activeFilter = 'all';
    let currentCoords = { lat: CONFIG.DEFAULT_MAP_CENTER[0], lon: CONFIG.DEFAULT_MAP_CENTER[1] };

    async function initExplorePage() {
      await initAuth();
      renderNavigation('explore');
      renderFooter();

      // Initialize Leaflet Map
      initMap('map', CONFIG.DEFAULT_MAP_CENTER, CONFIG.DEFAULT_ZOOM);

      // Listen for custom auth events to re-render nav
      window.addEventListener('fda:auth-changed', () => renderNavigation('explore'));

      // Event Listeners
      document.getElementById('search-submit-btn').addEventListener('click', handleCitySearch);
      document.getElementById('city-search-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleCitySearch();
      });

      document.getElementById('use-location-btn').addEventListener('click', handleGeolocation);
      document.getElementById('refresh-map-btn').addEventListener('click', () => loadPlacesForCoordinates(currentCoords.lat, currentCoords.lon));

      // Filters
      document.getElementById('filter-all-btn').addEventListener('click', () => applyFilter('all'));
      document.getElementById('filter-hotels-btn').addEventListener('click', () => applyFilter('hotel'));
      document.getElementById('filter-food-btn').addEventListener('click', () => applyFilter('food'));

      // Load initial places around default coordinates (Pune)
      await loadPlacesForCoordinates(currentCoords.lat, currentCoords.lon);
    }

    async function loadPlacesForCoordinates(lat, lon) {
      const container = document.getElementById('places-list-container');
      const countLabel = document.getElementById('places-count-label');
      
      container.innerHTML = `
        <div class="skeleton" style="height: 110px; margin-bottom: 8px;"></div>
        <div class="skeleton" style="height: 110px; margin-bottom: 8px;"></div>
        <div class="skeleton" style="height: 110px; margin-bottom: 8px;"></div>
      `;
      countLabel.textContent = 'Discovering hotels & restaurants...';

      try {
        currentPlaces = await fetchNearbyPlaces(lat, lon);
        countLabel.textContent = `Found ${currentPlaces.length} places`;

        renderPlaceList(currentPlaces);
        displayEstablishmentMarkers(currentPlaces, (place) => highlightPlaceCard(place));
      } catch (err) {
        console.error('Failed to load places:', err);
        countLabel.textContent = 'Unable to fetch places';
        container.innerHTML = `
          <div class="alert alert-error" style="margin: var(--space-4);">
            <div>
              <strong>Map query failed:</strong><br>
              ${escapeHTML(err.message || 'The OpenStreetMap Overpass service may be rate-limited.')}
              <div style="margin-top: 8px;">
                <button class="btn btn-secondary btn-sm" onclick="window.location.reload()">Retry Now</button>
              </div>
            </div>
          </div>
        `;
      }
    }

    function applyFilter(filter) {
      activeFilter = filter;
      document.querySelectorAll('#filter-wrapper button').forEach(b => b.classList.remove('btn-primary'));
      
      let filtered = currentPlaces;
      if (filter === 'hotel') {
        filtered = currentPlaces.filter(p => p.category.includes('hotel') || p.category.includes('guest') || p.category.includes('hostel'));
      } else if (filter === 'food') {
        filtered = currentPlaces.filter(p => p.category.includes('restaurant') || p.category.includes('cafe') || p.category.includes('fast_food'));
      }

      renderPlaceList(filtered);
      displayEstablishmentMarkers(filtered);
    }

    function renderPlaceList(places) {
      const container = document.getElementById('places-list-container');
      if (!places || places.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: var(--space-8); color: var(--text-muted);">
            <div style="font-size: 2rem; margin-bottom: 8px;">📍</div>
            <p>No establishments found in this immediate area.</p>
            <p style="font-size: 12px; margin-top: 4px;">Try searching another city or expanding the search.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = places.map(p => {
        const queryParams = new URLSearchParams({
          osm_type: p.osm_type,
          osm_id: p.osm_id,
          name: p.name,
          lat: p.lat,
          lon: p.lon,
          category: p.category,
          address: p.address || ''
        }).toString();

        return `
          <div class="place-card" id="place-card-${p.osm_id}" data-lat="${p.lat}" data-lon="${p.lon}">
            <div class="place-card-top">
              <div class="place-card-title">${escapeHTML(p.name)}</div>
              <span class="place-category">${escapeHTML(p.category)}</span>
            </div>
            <div class="place-card-address">${escapeHTML(p.address || 'Address not listed')}</div>
            <div class="place-card-footer">
              <div class="place-rating-badge">
                ${p.avg_rating ? `★ ${p.avg_rating} <span style="color:var(--text-muted);font-weight:normal;">(${p.review_count})</span>` : '<span style="color:var(--text-muted);font-weight:normal;">No reviews yet</span>'}
              </div>
              <div class="place-actions">
                <a href="${getDirectionsUrl(p.lat, p.lon)}" target="_blank" rel="noopener" class="btn btn-secondary btn-sm" title="Directions">
                  Directions ↗
                </a>
                <a href="hotel.html?${queryParams}" class="btn btn-primary btn-sm">
                  Details
                </a>
              </div>
            </div>
          </div>
        `;
      }).join('');

      // Add click handler to cards to pan map
      places.forEach(p => {
        const card = document.getElementById(`place-card-${p.osm_id}`);
        if (card) {
          card.addEventListener('click', (e) => {
            if (e.target.tagName.toLowerCase() === 'a' || e.target.closest('a')) return;
            setMapView(p.lat, p.lon, 16);
            highlightPlaceCard(p);
          });
        }
      });
    }

    function highlightPlaceCard(place) {
      document.querySelectorAll('.place-card').forEach(c => c.classList.remove('active'));
      const targetCard = document.getElementById(`place-card-${place.osm_id}`);
      if (targetCard) {
        targetCard.classList.add('active');
        targetCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    async function handleCitySearch() {
      const input = document.getElementById('city-search-input');
      const query = input.value.trim();
      if (!query) {
        showToast('Please enter a city or location name to search', 'warning');
        return;
      }

      showToast(`Searching location "${query}"...`, 'info');
      try {
        const geo = await geocodeCityOrArea(query);
        if (!geo) {
          showToast(`No coordinates found for "${query}". Try another city.`, 'error');
          return;
        }

        currentCoords = { lat: geo.lat, lon: geo.lon };
        setMapView(geo.lat, geo.lon, 14);
        await loadPlacesForCoordinates(geo.lat, geo.lon);
        showToast(`Centered on ${geo.display_name.split(',')[0]}`, 'success');
      } catch (err) {
        showToast(`Geocoding error: ${err.message}`, 'error');
      }
    }

    function handleGeolocation() {
      if (!navigator.geolocation) {
        showToast('Geolocation is not supported by your browser', 'error');
        return;
      }

      showToast('Requesting GPS location...', 'info');
      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const { latitude, longitude } = position.coords;
          currentCoords = { lat: latitude, lon: longitude };
          setMapView(latitude, longitude, 15);
          renderUserLocationMarker(latitude, longitude);
          await loadPlacesForCoordinates(latitude, longitude);
          showToast('Updated to your current location!', 'success');
        },
        (error) => {
          let msg = 'Location request failed';
          if (error.code === error.PERMISSION_DENIED) {
            msg = 'Location permission was denied. Please use the city search bar instead.';
          }
          showToast(msg, 'warning');
        },
        { timeout: 10000, enableHighAccuracy: true }
      );
    }

    window.addEventListener('DOMContentLoaded', initExplorePage);
  </script>
</body>
</html>
